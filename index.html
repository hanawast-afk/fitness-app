<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<meta name="theme-color" content="#16a34a">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316a34a'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white'%3E💪%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2316a34a'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white'%3E💪%3C/text%3E%3C/svg%3E">
<title>筋トレ記録</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--fg:#14201a;--sub:#66756c;--pri:#16a34a;--pri-fg:#fff;--line:#dde4e0;--acc:#f59e0b;--h0:#e6ebe8;--h1:#a7e3bd;--h2:#4ec27a;--h3:#16a34a;--danger:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--card:#18211c;--fg:#eaf1ed;--sub:#93a39a;--pri:#22c55e;--pri-fg:#04210f;--line:#2a372f;--acc:#fbbf24;--h0:#222d27;--h1:#1d5a35;--h2:#25904f;--h3:#22c55e;--danger:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 10px}
h2{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;color:inherit}
.opt{flex:1 1 28%;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;padding:6px}
.opt.on{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.feel{flex:1 1 17%;min-width:0}
input[type=text],input[type=number],input[type=date]{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:6px 10px;margin-top:8px}
.big{width:100%;min-height:56px;border:0;border-radius:14px;background:var(--pri);color:var(--pri-fg);font-size:18px;font-weight:700;margin-top:12px;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;min-height:36px;padding:0 12px;cursor:pointer}
.ghost.del{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px}.stats span{font-size:12px;color:var(--sub)}
.bar{height:10px;border-radius:5px;background:var(--h0);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.small{font-size:13px;color:var(--sub)}
.praise{display:none;background:var(--acc);color:#2b1d00;font-weight:700;text-align:center}
.praise.show{display:block;animation:pop .4s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{padding:8px;border-radius:12px;border:1px solid var(--line);font-size:13px;opacity:.45}
.badge.got{opacity:1;border-color:var(--acc)}
.badge em{font-style:normal;font-size:22px;display:block}
.heat{display:grid;grid-template-columns:repeat(7,1fr) 44px;gap:4px;align-items:center;text-align:center;font-size:11px;color:var(--sub)}
.cell{aspect-ratio:1;border-radius:6px;background:var(--h0);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg)}
.cell.l1{background:var(--h1)}.cell.l2{background:var(--h2)}.cell.l3{background:var(--h3);color:var(--pri-fg)}
.cell.rest{outline:2px dashed var(--acc)}.cell.today{outline:2px solid var(--fg)}.cell.none{background:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.pc{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.pc i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{font-size:13px;color:var(--sub);text-align:center;min-height:20px}
.big.done{background:var(--acc);color:#2b1d00;transition:background .15s}
.big.done:active,.big:active{transform:scale(.98)}
.bt{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-30px);z-index:20;width:min(92vw,420px);background:var(--card);color:var(--fg);border:2px solid var(--pri);border-radius:20px;padding:14px 16px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.bt.show{opacity:1;transform:translate(-50%,0)}
.bt .ck{width:56px;height:56px;line-height:56px;margin:0 auto 6px;border-radius:50%;background:var(--pri);color:var(--pri-fg);font-size:36px;font-weight:800}
.bt.show .ck{animation:pop .4s}
.bt .m{font-size:18px;font-weight:800}
.bt .l{font-size:14px;margin-top:4px;color:var(--sub)}
.bt .l.hi{color:var(--fg);font-weight:700}
.xpf{position:fixed;left:50%;top:55%;z-index:21;font-size:30px;font-weight:800;color:var(--acc);text-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none;animation:floatup 1.6s ease-out forwards}
@keyframes floatup{from{transform:translate(-50%,0);opacity:0}15%{opacity:1}to{transform:translate(-50%,-110px);opacity:0}}
.hello{display:none;font-size:13px;color:var(--sub);margin:-4px 2px 10px}.hello.show{display:block}
.opt.sm{min-height:36px;flex:1 1 40%;font-size:14px}
.ch{width:100%;height:auto;display:block;margin-top:8px}
.ch text{fill:var(--sub);font-size:10px;text-anchor:middle}.ch text.v{fill:var(--fg);font-weight:700}
.ch rect.b{fill:var(--pri)}.ch rect.cur{fill:var(--acc)}.ch rect.z{fill:var(--h0)}
.pb{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.pb:first-of-type{border-top:0}.pb span{color:var(--sub)}
@media(prefers-reduced-motion:reduce){.bt,.bt.show{transition:none;transform:translate(-50%,0)}.bt.show .ck,.praise.show{animation:none}.xpf{animation:none;transform:translate(-50%,-40px)}.pc i{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>💪 筋トレ記録</h1>
<div class="hello" id="hello"></div>

<div class="card praise" id="praise" role="status"></div>

<div class="card">
  <div class="stats">
    <div><b id="lv">1</b><span>レベル</span></div>
    <div><b id="streak">0</b><span>連続日数 🔥</span></div>
    <div><b id="wstreak">0週</b><span>週連続 🗓</span></div>
    <div><b id="xp">0</b><span>XP</span></div>
  </div>
  <div class="bar"><i id="xpbar" style="width:0"></i></div>
  <div class="small" id="xpnote"></div>
  <div class="small" id="wnote"></div>
  <div class="small" id="ticket"></div>
  <div class="small" id="care"></div>
</div>

<div class="card">
  <h2>今週のミッション（週3日・1回3分から）</h2>
  <div class="bar"><i id="mbar" style="width:0"></i></div>
  <div id="mtext"></div>
  <div class="small" id="mweek"></div>
</div>

<div class="card" id="form">
  <h2 id="formTitle">記録する</h2>
  <div class="row" id="exBtns"></div>
  <input type="text" id="exFree" placeholder="種目名を入力" maxlength="30" hidden>
  <h2 style="margin-top:14px">時間（分）</h2>
  <div class="row" id="minBtns"></div>
  <input type="number" id="minFree" inputmode="numeric" min="1" max="600" placeholder="分を入力" hidden>
  <h2 style="margin-top:14px">きつさ（1〜10）</h2>
  <div class="row" id="feelBtns"></div>
  <h2 style="margin-top:14px">日付</h2>
  <input type="date" id="date">
  <button class="big" id="save">記録する</button>
  <button class="ghost" id="cancel" hidden style="margin-top:8px;width:100%">編集をやめる</button>
</div>

<div class="card" id="review"><h2>ふりかえり（直近8週）</h2>
  <div class="row" id="rvTog"></div>
  <div id="rvChart"></div>
  <div id="rvCmp" style="margin-top:6px"></div>
  <h2 style="margin-top:14px">種目ごとの自己ベスト（1回の最長）</h2>
  <div id="rvPB"></div>
  <h2 style="margin-top:14px">きつさの週平均</h2>
  <div class="small" id="rvFeel"></div>
  <div class="small" id="rvCare"></div>
</div>

<div class="card"><h2>バッジ</h2><div class="badges" id="badges"></div></div>

<div class="card"><h2>カレンダー（11月〜）</h2>
  <div class="heat" id="heatHead"></div>
  <div class="heat" id="heat"></div>
  <div class="small" style="margin-top:6px">点線＝おやすみチケットで継続 / 右端＝週の実施日数</div>
</div>

<div class="card"><h2>記録一覧</h2><div id="list"></div></div>

<div class="card"><h2>バックアップ</h2>
  <div class="row">
    <button class="opt" id="exp">書き出し(JSON)</button>
    <button class="opt" id="imp">読み込み</button>
  </div>
  <input type="file" id="file" accept="application/json,.json" hidden>
  <div class="toast" id="toast"></div>
  <div class="small">データはこの端末のブラウザ内だけに保存されます。</div>
</div>
</main>
<div class="pc" id="pc"></div>
<div class="bt" id="bt" role="status" aria-live="polite"></div>

<script>
var SEED_CSV = "date,pushups,situps,hiplifts,sets,minutes,feeling,note\n";

var KEY = "fitness-app-v1";
var EXERCISES = ["腕立て","腹筋","お尻のピラティス","スクワット"];
var MINS = [1,2,3,5,10];
var START = "2026-11-01";
var PRAISES = ["えらい！今日もやった自分を褒めよう 👏","1回でも立派な一歩！","続けてる自分、かっこいい 🔥","短くてもOK。やったことが大事！","体が喜んでるよ 💚","ナイス！積み重ねが力になる","今日もクリア！おつかれさま ✨","やった日が増えていくの、最高！"];

// ---------- date helpers (local time) ----------
function pad(n){return n<10?"0"+n:""+n}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function today(){return fmt(new Date())}
function weekStart(s){var d=parse(s);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return fmt(d)}

// ---------- data ----------
function parseSeed(csv){
  var lines=csv.trim().split("\n").slice(1),out=[];
  lines.forEach(function(l,i){
    var c=l.split(",");
    var name=(c[7]||"").replace(/（.*?）/g,"").replace(/実施$/,"").trim();
    out.push({id:"seed"+i,date:c[0],exercise:name,minutes:c[5]?+c[5]:null,feeling:c[6]?+c[6]:null,
      note:"",extra:{pushups:c[1]||"",situps:c[2]||"",hiplifts:c[3]||"",sets:c[4]||""}});
  });
  return out;
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{var d=JSON.parse(raw);if(d&&Array.isArray(d.records))return d}catch(e){}}
  var d={records:parseSeed(SEED_CSV),seeded:true};
  save(d);return d;
}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
var state=(typeof localStorage!=="undefined")?load():{records:[]};

// ---------- logic ----------
function recXP(r,first){
  return 10+(first?30:0)+Math.min(r.minutes||0,10);
}
function computeXP(records){
  var seen={},xp=0,sorted=records.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  sorted.forEach(function(r){var f=!seen[r.date];seen[r.date]=1;xp+=recXP(r,f)});
  return xp;
}
function levelInfo(xp){
  var lv=1;while(xp>=lvStart(lv+1))lv++;
  var a=lvStart(lv),b=lvStart(lv+1);
  return {lv:lv,cur:xp-a,need:b-a};
}
function lvStart(l){return 50*(l-1)*l/2} // lv2=50, lv3=150...
function daysSet(records){var s={};records.forEach(function(r){s[r.date]=(s[r.date]||0)+1});return s}
// streak with weekly rest ticket (auto-used, 1 per Mon-Sun week)
function computeStreak(records,todayStr){
  var ds=daysSet(records),dates=Object.keys(ds).sort();
  var res={current:0,best:0,restDays:{},ticketUsedThisWeek:false};
  if(!dates.length)return res;
  var used={},cur=0,best=0,d=dates[0];
  while(d<todayStr){
    if(ds[d]){cur++}
    else{
      var w=weekStart(d);
      if(cur>0&&!used[w]){used[w]=1;res.restDays[d]=1}
      else cur=0;
    }
    if(cur>best)best=cur;
    d=addDays(d,1);
  }
  if(ds[todayStr])cur++;
  if(cur>best)best=cur;
  res.current=cur;res.best=best;
  res.ticketUsedThisWeek=!!used[weekStart(todayStr)];
  return res;
}
function weekDays(records,ws){
  var ds=daysSet(records),n=0;
  for(var i=0;i<7;i++)if(ds[addDays(ws,i)])n++;
  return n;
}
function maxWeekDays(records){
  var ws={};records.forEach(function(r){ws[weekStart(r.date)]=1});
  var m=0;Object.keys(ws).forEach(function(w){m=Math.max(m,weekDays(records,w))});return m;
}
function countWeek(ds,ws){var n=0;for(var i=0;i<7;i++)if(ds[addDays(ws,i)])n++;return n}
// weekly streak: Mon-Sun weeks with >=3 active days. Last week's streak is kept while this week is pending.
function weekStreak(records,todayStr){
  var ds=daysSet(records),dates=Object.keys(ds).sort(),cw=weekStart(todayStr);
  var res={current:0,best:0,thisDays:countWeek(ds,cw),thisHit:false,need:0};
  res.thisHit=res.thisDays>=3;res.need=Math.max(0,3-res.thisDays);
  if(!dates.length)return res;
  var w=weekStart(dates[0]),run=0,best=0;
  while(w<cw){
    if(countWeek(ds,w)>=3){run++;if(run>best)best=run}else run=0;
    w=addDays(w,7);
  }
  if(res.thisHit){run++;if(run>best)best=run}
  res.current=run;res.best=best;
  return res;
}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function totals(records){
  var m=0;records.forEach(function(r){m+=r.minutes>0?r.minutes:0});
  return {days:Object.keys(daysSet(records)).length,minutes:m};
}
// latest record date strictly before dateStr -> {prev,gap}; gap = calendar days since then
function lastBefore(records,dateStr){
  var p=null;records.forEach(function(r){if(r.date<dateStr&&(!p||r.date>p))p=r.date});
  return p?{prev:p,gap:daysBetween(p,dateStr)}:null;
}
// on app open: true if nothing recorded today and the last record is 3+ days back
function showWelcomeHint(records,todayStr){
  if(records.some(function(r){return r.date===todayStr}))return false;
  var lb=lastBefore(records,todayStr);
  return !!lb&&lb.gap>=3;
}
// last n Mon-Sun weeks (oldest first): days, minutes, avg feeling (null if none)
function weeklyTotals(records,todayStr,n){
  var cw=weekStart(todayStr),map={},out=[];
  records.forEach(function(r){
    var w=weekStart(r.date),o=map[w]||(map[w]={d:{},m:0,fs:0,fn:0});
    o.d[r.date]=1;o.m+=r.minutes>0?r.minutes:0;
    if(r.feeling>0){o.fs+=r.feeling;o.fn++}
  });
  for(var i=n-1;i>=0;i--){
    var ws=addDays(cw,-7*i),o=map[ws];
    out.push({ws:ws,days:o?Object.keys(o.d).length:0,minutes:o?o.m:0,feel:o&&o.fn?o.fs/o.fn:null});
  }
  return out;
}
// best single-session minutes per exercise (earliest date that reached it)
function personalBests(records){
  var sorted=records.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}),map={},order=[];
  sorted.forEach(function(r){
    if(!(r.minutes>0))return;
    if(!map[r.exercise]){map[r.exercise]={exercise:r.exercise,minutes:r.minutes,date:r.date};order.push(r.exercise)}
    else if(r.minutes>map[r.exercise].minutes){map[r.exercise].minutes=r.minutes;map[r.exercise].date=r.date}
  });
  var names=EXERCISES.filter(function(e){return map[e]}).concat(order.filter(function(e){return EXERCISES.indexOf(e)<0}));
  return names.map(function(e){return map[e]});
}
// two consecutive weeks (this/last, or last/2 weeks ago) with avg feeling >=7
function highEffortWeeks(wt){
  var n=wt.length;function hi(i){return wt[i].feel!==null&&wt[i].feel>=7}
  return n>=3&&((hi(n-1)&&hi(n-2))||(hi(n-2)&&hi(n-3)));
}
var BADGES=[
 {id:"first",icon:"🌱",name:"初記録",t:"はじめの一歩",f:function(c){return c.records.length>=1}},
 {id:"s3",icon:"🔥",name:"3日連続",t:"連続日数3",f:function(c){return c.st.best>=3}},
 {id:"s7",icon:"🏅",name:"7日連続",t:"連続日数7",f:function(c){return c.st.best>=7}},
 {id:"s14",icon:"🏆",name:"14日連続",t:"連続日数14",f:function(c){return c.st.best>=14}},
 {id:"w3",icon:"📅",name:"週3日達成",t:"1週間に3日",f:function(c){return maxWeekDays(c.records)>=3}},
 {id:"all",icon:"🎯",name:"全種目制覇",t:"4種目すべて",f:function(c){return EXERCISES.every(function(e){return c.records.some(function(r){return r.exercise===e})})}},
 {id:"r10",icon:"🔟",name:"10回記録",t:"記録10件",f:function(c){return c.records.length>=10}},
 {id:"d10",icon:"🗓️",name:"10日やった",t:"実施10日",f:function(c){return Object.keys(daysSet(c.records)).length>=10}},
 {id:"short",icon:"⚡",name:"ちょい運動",t:"1〜3分で記録",f:function(c){return c.records.some(function(r){return r.minutes&&r.minutes<=3})}},
 {id:"rest",icon:"🛌",name:"休養上手",t:"おやすみチケット使用",f:function(c){return Object.keys(c.st.restDays).length>=1}},
 {id:"lv5",icon:"⭐",name:"Lv5到達",t:"レベル5",f:function(c){return c.lv.lv>=5}}
];
function ctx(){
  var st=computeStreak(state.records,today());
  return {records:state.records,st:st,lv:levelInfo(computeXP(state.records))};
}
function earnedIds(){var c=ctx();return BADGES.filter(function(b){return b.f(c)}).map(function(b){return b.id})}

// ---------- UI state ----------
var sel={ex:null,min:null,minFree:false,feel:null,editId:null};
function $(id){return document.getElementById(id)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function buildForm(){
  var exB=$("exBtns");exB.textContent="";
  EXERCISES.concat(["その他"]).forEach(function(n){
    var b=el("button","opt",n);b.type="button";b.dataset.v=n;
    b.onclick=function(){sel.ex=n;if(n!=="その他")$("exFree").value="";renderForm()};
    exB.appendChild(b);
  });
  var mB=$("minBtns");mB.textContent="";
  MINS.forEach(function(m){
    var b=el("button","opt",m+"分");b.type="button";
    b.onclick=function(){sel.min=sel.min===m&&!sel.minFree?null:m;sel.minFree=false;renderForm()};
    b.dataset.v=m;mB.appendChild(b);
  });
  var o=el("button","opt","その他");o.type="button";o.dataset.v="free";
  o.onclick=function(){sel.minFree=true;sel.min=null;renderForm();$("minFree").focus()};
  mB.appendChild(o);
  var fB=$("feelBtns");fB.textContent="";
  for(var i=1;i<=10;i++){(function(i){
    var b=el("button","opt feel",""+i);b.type="button";b.dataset.v=i;
    b.onclick=function(){sel.feel=sel.feel===i?null:i;renderForm()};
    fB.appendChild(b);
  })(i)}
}
function renderForm(){
  [].forEach.call($("exBtns").children,function(b){b.classList.toggle("on",sel.ex===b.dataset.v)});
  $("exFree").hidden=sel.ex!=="その他";
  [].forEach.call($("minBtns").children,function(b){
    b.classList.toggle("on",b.dataset.v==="free"?sel.minFree:(!sel.minFree&&sel.min===+b.dataset.v));
  });
  $("minFree").hidden=!sel.minFree;
  [].forEach.call($("feelBtns").children,function(b){b.classList.toggle("on",sel.feel===+b.dataset.v)});
  $("formTitle").textContent=sel.editId?"記録を編集":"記録する";
  $("save").textContent=sel.editId?"更新する":"記録する";
  $("cancel").hidden=!sel.editId;
}
function resetForm(){
  sel={ex:null,min:null,minFree:false,feel:null,editId:null};
  $("exFree").value="";$("minFree").value="";$("date").value=today();renderForm();
}
var lock=false;
function recMinStr(r){return r.minutes?r.minutes+"分":"時間不明"}
function onSave(){
  if(lock)return;
  var ex=sel.ex==="その他"?$("exFree").value.trim():sel.ex;
  if(!ex){toast("種目を選んでね");return}
  var min=sel.minFree?parseInt($("minFree").value,10):sel.min;
  if(!(min>0))min=null;
  var date=$("date").value||today();
  lock=true;setTimeout(function(){lock=false},1000);
  var btn=$("save");btn.classList.add("done");btn.textContent="✓ 記録しました";
  setTimeout(function(){btn.classList.remove("done");renderForm()},1500);
  buzz();
  if(sel.editId){
    var r=state.records.filter(function(x){return x.id===sel.editId})[0];
    if(r){r.exercise=ex;r.minutes=min;r.feeling=sel.feel;r.date=date}
    save(state);resetForm();render();btn.classList.add("done");btn.textContent="✓ 記録しました";
    toast("更新しました");showBT("✓ 記録を更新しました",[]);return;
  }
  var before=earnedIds(),wasMission=weekDays(state.records,weekStart(date))>=3;
  var lvBefore=levelInfo(computeXP(state.records)).lv,maxBefore=maxWeekDays(state.records);
  var firstToday=!state.records.some(function(x){return x.date===date});
  var lb=(firstToday&&date===today())?lastBefore(state.records,date):null,isBack=!!lb&&lb.gap>=3;
  var prevBest=0,hadPrev=false;
  state.records.forEach(function(x){if(x.exercise===ex&&x.minutes>0){hadPrev=true;prevBest=Math.max(prevBest,x.minutes)}});
  var rec={id:"r"+Date.now()+Math.floor(Math.random()*1000),date:date,exercise:ex,minutes:min,feeling:sel.feel,note:""};
  state.records.push(rec);
  save(state);resetForm();render();
  btn.classList.add("done");btn.textContent="✓ 記録しました";
  var gain=recXP(rec,firstToday),lvAfter=levelInfo(computeXP(state.records)).lv;
  var ws=weekStart(date),mo=date.slice(0,7);
  var nWeek=state.records.filter(function(x){return weekStart(x.date)===ws}).length;
  var nMonth=state.records.filter(function(x){return x.date.slice(0,7)===mo}).length;
  var lines=[{t:"今週 "+nWeek+" 回目・今月 "+nMonth+" 回目"}];
  var backMsg="";
  if(isBack){
    var tt=totals(state.records),stNow=computeStreak(state.records,date);
    backMsg="👋 おかえり！記録は消えていません。累計 "+tt.days+"日・"+tt.minutes+"分";
    lines.unshift({t:backMsg,hi:1});
    if(stNow.current===1){
      var rs="🌱 新しい連続のスタート。これまでの自己最長 "+stNow.best+"日・累計 "+tt.days+"日・"+tt.minutes+"分";
      lines.splice(1,0,{t:rs,hi:1});backMsg+="\n"+rs;
    }
  }
  var xpl="+"+gain+" XP"+(firstToday?"（今日の最初の記録ボーナス +30 込み）":"");
  lines.push({t:xpl,hi:1});
  var big=firstToday||isBack;
  if(min&&hadPrev&&min>prevBest){lines.push({t:"🏆 自己ベスト更新！（"+ex+" "+min+"分）",hi:1});big=true}
  if(maxWeekDays(state.records)>maxBefore&&maxBefore>0){lines.push({t:"📈 週の最多記録！（"+maxWeekDays(state.records)+"日）",hi:1});big=true}
  if(lvAfter>lvBefore){lines.push({t:"⬆️ レベルアップ！ Lv"+lvAfter,hi:1});big=true}
  var nb=earnedIds().filter(function(i){return before.indexOf(i)<0});
  if(nb.length){lines.push({t:"🎉 バッジ獲得："+nb.map(function(i){return BADGES.filter(function(b){return b.id===i})[0].name}).join("、"),hi:1});big=true}
  var mission=weekDays(state.records,ws)>=3&&!wasMission;
  if(mission){lines.push({t:"🏁 今週の週3日ミッション達成！やったね！",hi:1});big=true;
    lines.push({t:"🗓 週連続 "+weekStreak(state.records,today()).current+"週",hi:1})}
  var msg=PRAISES[Math.floor(Math.random()*PRAISES.length)];
  if(nb.length)msg+="\n🎉 バッジ獲得："+nb.map(function(i){return BADGES.filter(function(b){return b.id===i})[0].name}).join("、");
  if(mission)msg+="\n🏁 今週のミッション達成！";
  if(backMsg)msg=backMsg+"\n"+msg;
  confetti(big?120:30);
  showBT("✓ "+ex+" "+recMinStr(rec)+" きつさ"+(rec.feeling||"不明")+" を記録",lines);
  floatXP("+"+gain+" XP");
  praise(msg);
}
function reduced(){return window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(40)}catch(e){}}
var btTimer=null;
function showBT(main,lines){
  var b=$("bt");b.textContent="";
  b.appendChild(el("div","ck","✓"));
  b.appendChild(el("div","m",main));
  lines.forEach(function(l){b.appendChild(el("div","l"+(l.hi?" hi":""),l.t))});
  b.classList.remove("show");void b.offsetWidth;b.classList.add("show");
  clearTimeout(btTimer);btTimer=setTimeout(function(){b.classList.remove("show")},lines.length>2?4500:3200);
}
function floatXP(t){
  var e=el("div","xpf",t);document.body.appendChild(e);
  setTimeout(function(){e.remove()},1700);
}
function praise(msg){var p=$("praise");p.textContent=msg;p.style.whiteSpace="pre-line";p.classList.remove("show");void p.offsetWidth;p.classList.add("show");p.scrollIntoView({behavior:"smooth",block:"nearest"})}
function toast(t){$("toast").textContent=t;setTimeout(function(){$("toast").textContent=""},3000)}
function confetti(n){
  if(reduced())return;
  var pc=$("pc"),cols=["#f59e0b","#22c55e","#3b82f6","#ef4444","#a855f7"];
  for(var i=0;i<(n||60);i++){
    var s=document.createElement("i");
    s.style.left=Math.random()*100+"%";s.style.background=cols[i%5];
    s.style.animationDelay=Math.random()*0.6+"s";
    pc.appendChild(s);
  }
  setTimeout(function(){pc.textContent=""},3500);
}

// ---------- render ----------
function render(){
  var c=ctx(),xp=computeXP(state.records);
  $("lv").textContent=c.lv.lv;$("xp").textContent=xp;$("streak").textContent=c.st.current;
  var ws3=weekStreak(state.records,today());
  $("wstreak").textContent=ws3.current+"週";
  $("wnote").textContent=ws3.thisHit?"🗓 今週も週3日を達成ずみ 🎉":"🗓 あと"+ws3.need+"日で"+(ws3.current>0?"今週も達成（週連続 "+ws3.current+"週をキープ中）":"今週の週3日達成");
  var hello=$("hello"),hint=showWelcomeHint(state.records,today());
  hello.textContent=hint?"おかえりなさい 🌿 1分だけでもOK。記録はそのまま残っています。":"";hello.classList.toggle("show",hint);
  $("xpbar").style.width=Math.round(c.lv.cur/c.lv.need*100)+"%";
  $("xpnote").textContent="次のレベルまであと "+(c.lv.need-c.lv.cur)+" XP（記録すれば必ずXP。その日の最初の記録はボーナス）";
  $("ticket").textContent=c.st.ticketUsedThisWeek?"🎫 おやすみチケット：今週は使用済み（休むのもOK）":"🎫 おやすみチケット：今週あり（1日休んでも連続が切れません）";
  // gentle note on high effort
  var recent=state.records.filter(function(r){return r.feeling}).sort(function(a,b){return a.date<b.date?-1:1}).slice(-3);
  $("care").textContent=(recent.length===3&&recent.every(function(r){return r.feeling>=8}))?"きつさが高い日が続いています。軽めの日もOKです 🍃":"";
  var wd=weekDays(state.records,weekStart(today()));
  $("mbar").style.width=Math.min(100,wd/3*100)+"%";
  $("mtext").textContent=wd>=3?"🎉 達成！ 今週 "+wd+"日 やりました":"今週 "+wd+" / 3 日（あと"+(3-wd)+"日）";
  $("mweek").textContent="🗓 週連続 "+ws3.current+"週（自己最長 "+ws3.best+"週）";
  renderReview();
  // badges
  var bd=$("badges");bd.textContent="";
  BADGES.forEach(function(b){
    var got=b.f(c),d=el("div","badge"+(got?" got":""));
    d.appendChild(el("em",null,got?b.icon:"🔒"));d.appendChild(el("b",null,b.name));d.appendChild(el("div","small",b.t));
    bd.appendChild(d);
  });
  renderHeat(c);renderList();
}
function renderHeat(c){
  var hh=$("heatHead");hh.textContent="";
  ["月","火","水","木","金","土","日","週"].forEach(function(t){hh.appendChild(el("div",null,t))});
  var h=$("heat");h.textContent="";
  var ds=daysSet(state.records),t=today(),ws=weekStart(START),last=weekStart(t);
  while(ws<=last){
    for(var i=0;i<7;i++){
      var d=addDays(ws,i),n=ds[d]||0,cell=el("div","cell");
      if(d<START||d>t){cell.classList.add("none")}
      else{
        cell.textContent=parse(d).getDate();
        if(n)cell.classList.add(n>=3?"l3":n===2?"l2":"l1");
        if(c.st.restDays[d])cell.classList.add("rest");
        if(d===t)cell.classList.add("today");
      }
      h.appendChild(cell);
    }
    h.appendChild(el("div",null,weekDays(state.records,ws)+"日"));
    ws=addDays(ws,7);
  }
}
var rvMode="min";
function svgEl(tag,attrs){
  var e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(var k in attrs)e.setAttribute(k,attrs[k]);return e;
}
function md(s){var d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()}
function renderReview(){
  var wt=weeklyTotals(state.records,today(),8);
  var tog=$("rvTog");tog.textContent="";
  [["min","合計分"],["days","実施日数"]].forEach(function(o){
    var b=el("button","opt sm"+(rvMode===o[0]?" on":""),o[1]);b.type="button";
    b.onclick=function(){rvMode=o[0];renderReview()};tog.appendChild(b);
  });
  var key=rvMode==="min"?"minutes":"days",unit=rvMode==="min"?"分":"日",ukey=rvMode==="min"?"days":"minutes",uunit=rvMode==="min"?"日":"分";
  var max=1;wt.forEach(function(w){if(w[key]>max)max=w[key]});
  var svg=svgEl("svg",{"class":"ch",viewBox:"0 0 320 140",role:"img"});
  svg.setAttribute("aria-label","直近8週の"+(rvMode==="min"?"合計分":"実施日数")+"："+wt.map(function(w){return md(w.ws)+"の週 "+w[key]+unit}).join("、"));
  wt.forEach(function(w,i){
    var x=i*40+6,h=Math.round(w[key]/max*72),y=104-h,cur=i===wt.length-1;
    svg.appendChild(svgEl("rect",{"class":w[key]?(cur?"cur":"b"):"z",x:x,y:w[key]?y:102,width:28,height:w[key]?h:2,rx:4}));
    var v=svgEl("text",{"class":"v",x:x+14,y:(w[key]?y:102)-4});v.textContent=w[key];svg.appendChild(v);
    var l=svgEl("text",{x:x+14,y:118});l.textContent=md(w.ws);svg.appendChild(l);
    var l2=svgEl("text",{x:x+14,y:132});l2.textContent=w[ukey]+uunit;svg.appendChild(l2);
  });
  var ch=$("rvChart");ch.textContent="";ch.appendChild(svg);
  ch.appendChild(el("div","small","週は月〜日。棒＝"+(rvMode==="min"?"合計分":"実施日数")+"、下段＝"+(rvMode==="min"?"実施日数":"合計分")+"、黄色＝今週"));
  var tw=wt[7],lw=wt[6],diff=tw.minutes-lw.minutes,t;
  if(!state.records.length)t="記録するとここに今週の分数が出ます。";
  else if(tw.minutes===0&&tw.days===0)t="今週はこれから。先週は "+lw.minutes+"分（"+lw.days+"日）。1分だけでもOK。";
  else if(lw.minutes===0&&lw.days===0)t="今週 "+tw.minutes+"分（"+tw.days+"日）。先週は記録なし。";
  else if(diff>0)t="今週 "+tw.minutes+"分（"+tw.days+"日）。先週より +"+diff+"分";
  else if(diff===0)t="今週 "+tw.minutes+"分（"+tw.days+"日）。先週と同じ分数";
  else t="今週 "+tw.minutes+"分（"+tw.days+"日）。先週は先週、今週は今週。自分のペースでOK 🌱";
  $("rvCmp").textContent=t;
  var pbs=personalBests(state.records),pb=$("rvPB");pb.textContent="";
  if(!pbs.length)pb.appendChild(el("div","small","分数つきの記録がたまると、ここに自己ベストが出ます。"));
  pbs.forEach(function(p){
    var r=el("div","pb");r.appendChild(el("b",null,p.exercise));r.appendChild(el("span",null,"最長 "+p.minutes+"分（"+md(p.date)+"）"));pb.appendChild(r);
  });
  var names=["3週前","2週前","先週","今週"];
  $("rvFeel").textContent=wt.slice(4).map(function(w,i){return names[i]+" "+(w.feel===null?"—":w.feel.toFixed(1))}).join(" → ");
  $("rvCare").textContent=highEffortWeeks(wt)?"きつさが高めの週が続いています。軽めの日もOKです 🍃":"";
}
var JP=["日","月","火","水","木","金","土"];
function renderList(){
  var l=$("list");l.textContent="";
  var rs=state.records.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});
  if(!rs.length){l.appendChild(el("div","small","まだ記録がありません"));return}
  rs.forEach(function(r){
    var it=el("div","item"),left=el("div");
    var dt=parse(r.date);
    left.appendChild(el("b",null,(dt.getMonth()+1)+"/"+dt.getDate()+"("+JP[dt.getDay()]+") "+r.exercise));
    left.appendChild(el("div","small",(r.minutes?r.minutes+"分":"時間 不明")+" ・ きつさ "+(r.feeling||"不明")));
    var btns=el("div","row");
    var e=el("button","ghost","編集"),x=el("button","ghost del","削除");
    e.onclick=function(){
      sel.editId=r.id;sel.ex=EXERCISES.indexOf(r.exercise)>=0?r.exercise:"その他";
      $("exFree").value=EXERCISES.indexOf(r.exercise)>=0?"":r.exercise;
      sel.feel=r.feeling;sel.minFree=false;sel.min=null;$("minFree").value="";
      if(r.minutes){if(MINS.indexOf(r.minutes)>=0)sel.min=r.minutes;else{sel.minFree=true;$("minFree").value=r.minutes}}
      $("date").value=r.date;renderForm();$("form").scrollIntoView({behavior:"smooth"});
    };
    x.onclick=function(){
      if(confirm("この記録を削除しますか？")){
        state.records=state.records.filter(function(q){return q.id!==r.id});
        save(state);if(sel.editId===r.id)resetForm();render();
      }
    };
    btns.appendChild(e);btns.appendChild(x);it.appendChild(left);it.appendChild(btns);l.appendChild(it);
  });
}

// ---------- backup ----------
function exportJSON(){
  var blob=new Blob([JSON.stringify({app:"fitness-app",version:1,exportedAt:new Date().toISOString(),records:state.records},null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fitness-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}
function validRec(r){
  return r&&typeof r.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&typeof r.exercise==="string"&&r.exercise;
}
function importJSON(text){
  var d;try{d=JSON.parse(text)}catch(e){toast("読み込めませんでした（JSONではありません）");return}
  var rs=d&&d.records;
  if(!Array.isArray(rs)||!rs.every(validRec)){toast("形式が違うため読み込みませんでした");return}
  if(!confirm(rs.length+"件で現在の記録を置き換えます。よろしいですか？"))return;
  state.records=rs.map(function(r,i){
    return {id:String(r.id||"i"+Date.now()+i),date:r.date,exercise:String(r.exercise).slice(0,30),
      minutes:r.minutes>0?+r.minutes:null,feeling:r.feeling>=1&&r.feeling<=10?+r.feeling:null,note:String(r.note||"")};
  });
  save(state);resetForm();render();toast(rs.length+"件を読み込みました");
}

// ---------- init ----------
if(typeof document!=="undefined"&&document.getElementById("save")){
  buildForm();resetForm();
  $("save").onclick=onSave;
  $("cancel").onclick=resetForm;
  $("exp").onclick=exportJSON;
  $("imp").onclick=function(){$("file").click()};
  $("file").onchange=function(){
    var f=this.files[0];if(!f)return;
    var fr=new FileReader();fr.onload=function(){importJSON(fr.result)};fr.readAsText(f);this.value="";
  };
  render();
}
</script>
